<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CicloAlerta</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { --fundo: #ffffff; --texto: #14213d; --borda: #d0d5dd; --destaque: #0b5fff; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; color: var(--texto); background: var(--fundo); }
    body { display: flex; flex-direction: column; }
    header { padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--borda); }
    h1 { font-size: 1.1rem; margin: 0; }
    #chuva { display: none; padding: 10px 16px; background: #fff3cd; color: #5c4400; font-weight: 600; }
    #chuva.critico { background: #b42318; color: #fff; }
    #mapa { flex: 1; min-height: 300px; }
    form { padding: 12px 16px; display: grid; gap: 8px; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--borda); }
    form p { grid-column: 1 / -1; margin: 0; font-size: .9rem; }
    label { font-size: .85rem; display: grid; gap: 4px; }
    select, button { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--borda); background: #fff; color: inherit; }
    button { grid-column: 1 / -1; background: var(--destaque); color: #fff; border: 0; font-weight: 600; }
    button:disabled { opacity: .5; }
    button:focus-visible, select:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
    #aviso { grid-column: 1 / -1; min-height: 1.2em; font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <h1>CicloAlerta</h1>
    <span id="total" aria-live="polite"></span>
  </header>
  <div id="chuva" role="status" aria-live="polite"></div>
  <div id="mapa" role="application" aria-label="Mapa dos perigos nas ciclovias"></div>

  <form id="reportar">
    <p>Toque no mapa para marcar o local do perigo e envie.</p>
    <label>Tipo
      <select name="tipo">
        <option value="buraco">Buraco</option>
        <option value="poca">Poça</option>
        <option value="desnivel">Desnível</option>
        <option value="outro">Outro</option>
      </select>
    </label>
    <label>Gravidade
      <select name="severidade">
        <option value="baixa">Baixa</option>
        <option value="media" selected>Média</option>
        <option value="alta">Alta</option>
      </select>
    </label>
    <button type="submit" disabled>Reportar perigo</button>
    <div id="aviso" role="status" aria-live="polite"></div>
  </form>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const cores = { baixa: "#2e7d32", media: "#f59e0b", alta: "#b42318" };
    const nomes = { buraco: "Buraco", poca: "Poça", desnivel: "Desnível", outro: "Outro" };
    const mapa = L.map("mapa").setView([-23.5714, -46.6700], 13);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap"
    }).addTo(mapa);
    const camada = L.layerGroup().addTo(mapa);
    const form = document.getElementById("reportar");
    const botao = form.querySelector("button");
    const aviso = document.getElementById("aviso");
    let marcador = null;

    async function carregarRelatos() {
      const relatos = await (await fetch("/api/relatos")).json();
      camada.clearLayers();
      for (const r of relatos) {
        L.circleMarker([r.lat, r.lon], { radius: 9, color: cores[r.severidade], fillOpacity: .7 })
          .bindPopup(`${nomes[r.tipo]} · gravidade ${r.severidade}${r.simulado ? " · exemplo" : ""}`)
          .addTo(camada);
      }
      document.getElementById("total").textContent = `${relatos.length} perigos`;
    }

    async function carregarClima() {
      const faixa = document.getElementById("chuva");
      try {
        const clima = await (await fetch("/api/clima")).json();
        const alertas = await (await fetch("/api/alertas?limite=1")).json();
        if (clima.chove_agora || clima.chove_proxima_hora) {
          faixa.style.display = "block";
          faixa.textContent = clima.chove_agora
            ? "Está chovendo: buracos podem estar escondidos pela água."
            : "Chuva prevista para a próxima hora: redobre a atenção.";
          if (alertas.length && alertas[0].nivel === "critico") {
            faixa.classList.add("critico");
            faixa.textContent += " " + alertas[0].mensagem;
          }
        }
      } catch { /* sem previsão, o mapa continua funcionando */ }
    }

    mapa.on("click", (e) => {
      if (marcador) marcador.remove();
      marcador = L.marker(e.latlng).addTo(mapa);
      botao.disabled = false;
      aviso.textContent = "";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!marcador) return;
      botao.disabled = true;
      const { lat, lng } = marcador.getLatLng();
      const corpo = { lat, lon: lng, tipo: form.tipo.value, severidade: form.severidade.value, origem: "app" };
      const resposta = await fetch("/api/relatos", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo)
      });
      if (resposta.ok) {
        aviso.textContent = "Perigo registrado. Obrigado!";
        marcador.remove(); marcador = null;
        carregarRelatos();
      } else {
        aviso.textContent = "Não foi possível registrar. O ponto precisa estar na cidade de São Paulo.";
        botao.disabled = false;
      }
    });

    carregarRelatos();
    carregarClima();
  </script>
</body>
</html>
